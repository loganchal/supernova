name: Probe polyDB dimension 9

on:
  push:
    branches: [ewald-search-20260902]
    paths:
      - '.github/workflows/ewald-d9-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pymongo
        run: python3 -m pip install --quiet pymongo
      - name: Probe documented collection by indexed ID range
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ewald-d9-probe.txt
          import json
          from pymongo import MongoClient

          uri = 'mongodb://polymake:database@db.polymake.org:27017/?tls=true&directConnection=true'
          c = MongoClient(uri, serverSelectionTimeoutMS=15000, connectTimeoutMS=15000, socketTimeoutMS=15000)
          print('PING', c.admin.command('ping'))
          db = c.polydb
          for name in ['Polytopes.Lattice.SmoothReflexive', 'LatticePolytopes.SmoothReflexive', 'SmoothReflexive']:
              print('COLLECTION', name)
              coll = db[name]
              try:
                  anydoc = coll.find_one({}, max_time_ms=5000)
                  print('ANY_ID', None if anydoc is None else anydoc.get('_id'))
              except Exception as e:
                  print('ANY_ERROR', type(e).__name__, str(e)); continue
              if anydoc is None:
                  continue
              ranges = [
                  {'_id': {'$gte': 'F.9D.', '$lt': 'F.9E.'}},
                  {'_id': {'$gte': '9.', '$lt': '9/'}},
                  {'CONE_DIM': 10},
              ]
              for filt in ranges:
                  try:
                      doc = coll.find_one(filt, max_time_ms=10000)
                  except Exception as e:
                      print('QUERY_ERROR', json.dumps(filt), type(e).__name__, str(e)); continue
                  print('QUERY', json.dumps(filt), 'ID', None if doc is None else doc.get('_id'))
                  if doc is None:
                      continue
                  print('KEYS', json.dumps(sorted(doc.keys())))
                  for key in sorted(doc):
                      if key == '_id': continue
                      text = repr(doc[key])
                      if len(text) > 10000: text = text[:10000] + '...'
                      print('FIELD', key, text)
                  break
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-d9-probe-indexed
          path: ewald-d9-probe.txt
          if-no-files-found: warn
          retention-days: 7
