name: Probe polyDB dimension 9

on:
  push:
    branches: [ewald-search-20260902]
    paths:
      - '.github/workflows/ewald-d9-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pymongo
        run: python3 -m pip install --quiet pymongo
      - name: Probe known collection names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ewald-d9-probe.txt
          import json
          from pymongo import MongoClient

          uri = 'mongodb://polymake:database@db.polymake.org:27017/?tls=true&directConnection=true'
          c = MongoClient(uri, serverSelectionTimeoutMS=20000, connectTimeoutMS=20000)
          print('PING', c.admin.command('ping'))
          db = c.polydb
          names = [
              'Polytopes.Lattice.SmoothReflexive',
              'LatticePolytopes.SmoothReflexive',
              'SmoothReflexive',
          ]
          filters = [
              {'CONE_DIM': 10},
              {'CONE_DIM': 9},
              {'DIM': 9},
              {'_id': {'$regex': '^F\\.9D\\.'}},
              {},
          ]
          for name in names:
              coll = db[name]
              print('COLLECTION', name)
              for filt in filters:
                  try:
                      doc = coll.find_one(filt)
                  except Exception as e:
                      print('FIND_ERROR', json.dumps(filt), type(e).__name__, str(e)); continue
                  if doc is None:
                      print('NO_DOC', json.dumps(filt)); continue
                  print('FILTER', json.dumps(filt))
                  print('ID', doc.get('_id'))
                  print('KEYS', json.dumps(sorted(doc.keys())))
                  for key in sorted(doc):
                      if key == '_id': continue
                      text = repr(doc[key])
                      if len(text) > 5000: text = text[:5000] + '...'
                      print('FIELD', key, text)
                  break
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ewald-d9-probe-known
          path: ewald-d9-probe.txt
          if-no-files-found: warn
          retention-days: 7
